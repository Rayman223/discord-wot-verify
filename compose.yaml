services:
  wot-verify:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      - swag
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 60s
      retries: 3

networks:
  swag:
    external: true
    name: ${SWAG_NETWORK:-swag}
